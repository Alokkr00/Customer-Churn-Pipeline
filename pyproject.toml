[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-churn-pipeline"
version = "0.1.0"
description = "End-to-end Customer Churn Prediction and Retention Pipeline"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "MLOps Team" }
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
    "xgboost>=2.0.0",
    "mlflow>=2.10.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "requests>=2.31.0",
    "evidently>=0.4.14",
    "dbt-core>=1.7.0",
    "dbt-postgres>=1.7.0",
    "pytest>=7.4.0",
    "ruff>=0.2.0"
]

[project.optional-dependencies]
dev = [
    "black>=23.12.0",
    "isort>=5.13.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "dbt_packages",
    "target"
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | dbt_packages
  | target
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
