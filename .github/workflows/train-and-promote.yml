name: Automated Retraining & Model Promotion

on:
  schedule:
    - cron: '0 2 * * 1'  # Every Monday at 02:00 AM UTC
  workflow_dispatch:
    inputs:
      force_evaluation:
        description: 'Run evaluation even if cold-start'
        required: false
        type: boolean
        default: true

jobs:
  retrain-and-promote:
    name: Retrain & Model Promotion Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Ingest & Cache Training Dataset
        run: |
          python -m src.data.ingest

      - name: Train Models & Log to MLflow
        env:
          MLFLOW_TRACKING_URI: "sqlite:///mlflow.db"
          MLFLOW_EXPERIMENT_NAME: "customer_churn_ci_retrain"
        run: |
          python -m src.training.train

      - name: Evaluate Promotion Gate (ΔAUC & PSI Drift)
        id: evaluate_gate
        env:
          MLFLOW_TRACKING_URI: "sqlite:///mlflow.db"
          AUC_IMPROVEMENT_THRESHOLD: "0.01"
          DRIFT_PSI_THRESHOLD: "0.10"
        run: |
          python -m src.training.evaluate

      - name: Generate Promotion Summary & Outputs
        id: summary
        run: |
          python -c "
          import json, os

          decision_path = 'models/evaluation_decision.json'
          if os.path.exists(decision_path):
              with open(decision_path) as f:
                  data = json.load(f)
          else:
              data = {'promoted': False, 'reason': 'Decision file not found', 'candidate_auc': 0.0}

          promoted = data.get('promoted', False)
          reason = data.get('reason', 'N/A')
          cand_auc = data.get('candidate_auc', 'N/A')
          prod_auc = data.get('production_auc', 'None (Cold Start)')
          delta_auc = data.get('auc_delta', 'N/A')
          psi = data.get('drift_psi_score', 'N/A')

          status_badge = '🚀 **PROMOTED TO PRODUCTION**' if promoted else '🛡️ **RETAINED EXISTING CHAMPION**'

          summary_md = f'''
          ## 🤖 Automated Retraining & Promotion Report

          | Metric / Property | Value |
          |---|---|
          | **Promotion Status** | {status_badge} |
          | **Decision Reason** | {reason} |
          | **Candidate ROC-AUC** | `{cand_auc}` |
          | **Previous Production ROC-AUC** | `{prod_auc}` |
          | **Delta AUC (Gain)** | `{delta_auc}` |
          | **Population Drift (PSI)** | `{psi}` (Limit: $\le$ 0.10) |

          '''
          summary_file = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_file:
              with open(summary_file, 'a') as f:
                  f.write(summary_md)

          output_file = os.environ.get('GITHUB_OUTPUT')
          if output_file:
              with open(output_file, 'a') as f:
                  f.write(f'promoted={str(promoted).lower()}\n')
                  f.write(f'candidate_auc={cand_auc}\n')
          "

      - name: Archive Model Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-model
          path: models/
          retention-days: 30
