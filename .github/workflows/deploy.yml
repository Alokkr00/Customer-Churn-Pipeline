name: Build & Publish Serving Container

on:
  workflow_run:
    workflows: ["Automated Retraining & Model Promotion"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_latest:
        description: 'Tag published container as latest'
        type: boolean
        default: true

jobs:
  build-and-push:
    name: Build & Publish to GHCR
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Download Promoted Model Artifact
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v4
        with:
          name: production-model
          path: models/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Ensure Production Model Exists
        run: |
          python -c "
          import os
          from pathlib import Path
          prod_model = Path('models/churn_champion_prod.joblib')
          if not prod_model.exists():
              print('No production model cached. Generating default model artifact...')
              os.system('pip install -r requirements.txt && pip install -e .')
              os.system('python -m src.data.ingest')
              os.system('python -m src.training.train')
              os.system('python -m src.training.evaluate')
          else:
              print(f'Using validated model: {prod_model}')
          "

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/serving
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_run' || github.event.inputs.tag_latest == 'true' }}
            type=sha,prefix=sha-,format=short
            type=schedule,pattern={{date 'YYYYMMDD'}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish Deployment Summary
        run: |
          echo "## 🚢 Container Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Registry** | \`ghcr.io\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`ghcr.io/${{ github.repository }}/serving:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tags** | \`${{ steps.meta.outputs.tags }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Pull Command" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ghcr.io/${{ github.repository }}/serving:latest" >> $GITHUB_STEP_SUMMARY
          echo "docker run -d -p 8000:8000 ghcr.io/${{ github.repository }}/serving:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
