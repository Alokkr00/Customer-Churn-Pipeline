churn_postgres:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      user: "{{ env_var('POSTGRES_USER', 'churn_user') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'churn_pass') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      dbname: "{{ env_var('POSTGRES_DB', 'churn_db') }}"
      schema: public
      threads: 4
      keepalives_idle: 0
    ci:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'postgres') }}"
      user: "{{ env_var('POSTGRES_USER', 'churn_user') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'churn_pass') }}"
      port: 5432
      dbname: "{{ env_var('POSTGRES_DB', 'churn_db') }}"
      schema: public
      threads: 2
